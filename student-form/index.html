<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Information Form</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f2f2f2; display: flex; justify-content: center; padding: 40px;">

  <form style="background-color: #ffffff; padding: 30px 40px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.15); width: 350px;">

    <h2 style="text-align: center; color: #333;">Student Information Form</h2>

    <label style="display: block; margin-top: 15px; margin-bottom: 5px; color: #333;">Name</label>
    <input type="text" name="name" placeholder="Enter your name" required style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">

    <label style="display: block; margin-top: 15px; margin-bottom: 5px; color: #333;">Class</label>
    <input type="text" name="studentClass" placeholder="Enter your class" required style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">

    <label style="display: block; margin-top: 15px; margin-bottom: 5px; color: #333;">Roll No</label>
    <input type="text" name="rollNo" placeholder="Enter your roll number" required style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">

    <label style="display: block; margin-top: 15px; margin-bottom: 5px; color: #333;">College</label>
    <input type="text" name="college" placeholder="Enter your college name" required style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">

    <label style="display: block; margin-top: 15px; margin-bottom: 5px; color: #333;">Email</label>
    <input type="email" name="email" placeholder="Enter your email" required style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">

    <div style="margin-top: 25px; text-align: center;">
      <button type="submit" style="background-color: #4CAF50; color: white; border: none; padding: 10px 20px; margin-right: 10px; border-radius: 4px; cursor: pointer;">Submit</button>
      <button type="reset" style="background-color: #f44336; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer;">Reset</button>
    </div>

  </form>

</body>
</html>
