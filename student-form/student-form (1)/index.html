<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Information Form</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 40px;">

  <form style="padding: 20px; max-width: 320px;">

    <h2>Student Information Form</h2>

    <label>Name</label><br>
    <input type="text" name="name" required style="padding: 6px; margin: 5px 0 15px 0; width: 100%;"><br>

    <label>Date of Birth</label><br>
    <input type="date" name="dob" required style="padding: 6px; margin: 5px 0 15px 0; width: 100%;"><br>

    <label>Class</label><br>
    <input type="text" name="studentClass" required style="padding: 6px; margin: 5px 0 15px 0; width: 100%;"><br>

    <label>Section</label><br>
    <input type="text" name="section" required style="padding: 6px; margin: 5px 0 15px 0; width: 100%;"><br>

    <label>Roll No</label><br>
    <input type="text" name="rollNo" required style="padding: 6px; margin: 5px 0 15px 0; width: 100%;"><br>

    <label>College</label><br>
    <input type="text" name="college" required style="padding: 6px; margin: 5px 0 15px 0; width: 100%;"><br>

    <label>Course / Branch</label><br>
    <input type="text" name="course" required style="padding: 6px; margin: 5px 0 15px 0; width: 100%;"><br>

    <label>Father's Name</label><br>
    <input type="text" name="fatherName" required style="padding: 6px; margin: 5px 0 15px 0; width: 100%;"><br>

    <label>Mother's Name</label><br>
    <input type="text" name="motherName" required style="padding: 6px; margin: 5px 0 15px 0; width: 100%;"><br>

    <label>Gender</label><br>
    <select name="gender" required style="padding: 6px; margin: 5px 0 15px 0; width: 100%;">
      <option value="">Select</option>
      <option value="male">Male</option>
      <option value="female">Female</option>
      <option value="other">Other</option>
    </select><br>

    <label>Blood Group</label><br>
    <input type="text" name="bloodGroup" placeholder="e.g. O+" style="padding: 6px; margin: 5px 0 15px 0; width: 100%;"><br>

    <label>Aadhaar Number</label><br>
    <input type="text" name="aadhaar" maxlength="12" pattern="[0-9]{12}" placeholder="12-digit number" style="padding: 6px; margin: 5px 0 15px 0; width: 100%;"><br>

    <label>Phone Number</label><br>
    <input type="tel" name="phone" required style="padding: 6px; margin: 5px 0 15px 0; width: 100%;"><br>

    <label>Email</label><br>
    <input type="email" name="email" required style="padding: 6px; margin: 5px 0 15px 0; width: 100%;"><br>

    <label>Address</label><br>
    <textarea name="address" rows="3" style="padding: 6px; margin: 5px 0 15px 0; width: 100%;"></textarea><br>

    <label>City</label><br>
    <input type="text" name="city" required style="padding: 6px; margin: 5px 0 15px 0; width: 100%;"><br>

    <label>State</label><br>
    <input type="text" name="state" required style="padding: 6px; margin: 5px 0 15px 0; width: 100%;"><br>

    <label>Pin Code</label><br>
    <input type="text" name="pincode" maxlength="6" pattern="[0-9]{6}" style="padding: 6px; margin: 5px 0 15px 0; width: 100%;"><br>

    <button type="submit" style="padding: 8px 16px;">Submit</button>
    <button type="reset" style="padding: 8px 16px;">Reset</button>

  </form>

</body>
</html>
